<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>กระดานติดตามสัญญา</title>
  <style>
    :root {
      --page: #f7f7f5;
      --surface: #ffffff;
      --surface-soft: #f1f1ee;
      --text: #171717;
      --muted: #6c6c68;
      --line: #d9d9d4;
      --strong-line: #aaa9a3;
      --shadow: 0 10px 30px rgba(0, 0, 0, .06);
      --button: #171717;
      --button-text: #fff;
      --focus: #555;
    }

    :root[data-theme="dark"] {
      --page: #151515;
      --surface: #202020;
      --surface-soft: #2a2a2a;
      --text: #f5f5f2;
      --muted: #b8b8b0;
      --line: #3d3d3a;
      --strong-line: #73736d;
      --shadow: 0 10px 30px rgba(0, 0, 0, .28);
      --button: #f2f2ed;
      --button-text: #171717;
      --focus: #ddd;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      line-height: 1.5;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

    .app { max-width: 1500px; margin: 0 auto; padding: 32px clamp(18px, 4vw, 64px) 56px; }
    .topbar { display: flex; align-items: start; justify-content: space-between; gap: 24px; margin-bottom: 38px; }
    .eyebrow { color: var(--muted); font-size: .78rem; font-weight: 700; letter-spacing: .12em; margin: 0 0 7px; text-transform: uppercase; }
    h1 { font-size: clamp(2rem, 4vw, 3.25rem); line-height: 1.08; letter-spacing: -.05em; margin: 0; }
    .subhead { color: var(--muted); margin: 10px 0 0; }
    .theme-button, .add-button, .move-button, .icon-button {
      border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); transition: transform .15s ease, background .15s ease;
    }
    .theme-button { min-height: 44px; padding: 0 15px; white-space: nowrap; }
    .theme-button:hover, .icon-button:hover, .move-button:hover { background: var(--surface-soft); transform: translateY(-1px); }

    .board { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 18px; align-items: start; }
    .column { background: var(--surface-soft); border: 1px solid var(--line); border-radius: 16px; min-height: 400px; padding: 14px; }
    .column.is-over { outline: 2px dashed var(--strong-line); outline-offset: 3px; }
    .column-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 3px 3px 14px; }
    .column-title { font-size: 1rem; font-weight: 750; letter-spacing: -.02em; margin: 0; }
    .count { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: .78rem; font-weight: 700; min-width: 28px; padding: 2px 8px; text-align: center; }
    .card-list { display: grid; gap: 10px; min-height: 18px; }
    .empty { color: var(--muted); font-size: .9rem; padding: 12px 5px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; }
    .card[draggable="true"] { cursor: grab; }
    .card.dragging { opacity: .42; }
    .card-text { font-size: 1rem; margin: 0 0 14px; overflow-wrap: anywhere; }
    .card-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .mobile-moves { display: none; gap: 7px; }
    .move-button { min-height: 42px; min-width: 46px; font-size: 1.2rem; font-weight: 700; }
    .move-button:disabled { cursor: not-allowed; opacity: .35; transform: none; }
    .edit-delete { display: flex; gap: 6px; margin-left: auto; }
    .icon-button { min-height: 34px; padding: 0 9px; font-size: .78rem; }
    .delete { color: #a33131; }
    .add-button { background: var(--button); border-color: var(--button); color: var(--button-text); font-weight: 700; margin-top: 13px; min-height: 43px; padding: 0 14px; width: 100%; }
    .add-button:hover { opacity: .88; }

    @media (max-width: 820px) {
      .app { padding-top: 24px; }
      .topbar { margin-bottom: 26px; }
      .board { grid-template-columns: 1fr; gap: 14px; }
      .column { min-height: auto; }
      .card[draggable="true"] { cursor: default; }
      .mobile-moves { display: flex; }
      .move-button { min-width: 52px; min-height: 46px; }
    }
    @media (max-width: 460px) {
      .topbar { gap: 14px; }
      .theme-button { font-size: .85rem; padding: 0 10px; }
      .card-actions { align-items: end; }
      .icon-button { padding: 0 7px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Contract administration</p>
        <h1>กระดานติดตามสัญญา</h1>
        <p class="subhead">ติดตามงานเอกสารสัญญา ตั้งแต่รับเรื่องจนจัดเก็บเรียบร้อย</p>
      </div>
      <button class="theme-button" id="themeButton" type="button" aria-label="สลับโหมดสี"></button>
    </header>
    <section class="board" id="board" aria-label="กระดานติดตามสัญญา"></section>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "contract-kanban-cards-v1";
      const THEME_KEY = "contract-kanban-theme-v1";

      // แก้ชื่อคอลัมน์สำหรับขั้นตอนงานของคุณได้ตรงนี้เลย
      const columns = [
        { id: "received", title: "รับเรื่องและรวบรวมเอกสาร" },
        { id: "review", title: "ตรวจร่างสัญญา" },
        { id: "approval", title: "รออนุมัติและลงนาม" },
        { id: "archive", title: "จัดเก็บและติดตามผล" }
      ];

      const board = document.getElementById("board");
      const themeButton = document.getElementById("themeButton");
      let cards = loadCards();
      let draggedCardId = null;

      function loadCards() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          return Array.isArray(saved) ? saved.filter(card => card && typeof card.id === "string" && typeof card.text === "string" && columns.some(column => column.id === card.columnId)) : [];
        } catch { return []; }
      }

      function saveCards() { localStorage.setItem(STORAGE_KEY, JSON.stringify(cards)); }
      function escapeHtml(value) {
        const element = document.createElement("div");
        element.textContent = value;
        return element.innerHTML;
      }
      function indexOfColumn(columnId) { return columns.findIndex(column => column.id === columnId); }

      function render() {
        board.innerHTML = columns.map((column) => {
          const cardsHere = cards.filter(card => card.columnId === column.id);
          const cardMarkup = cardsHere.length ? cardsHere.map(card => cardTemplate(card)).join("") : '<p class="empty">ยังไม่มีงานในขั้นตอนนี้</p>';
          return `
            <section class="column" data-column-id="${column.id}">
              <header class="column-header"><h2 class="column-title">${column.title}</h2><span class="count">${cardsHere.length}</span></header>
              <div class="card-list">${cardMarkup}</div>
              <button class="add-button" type="button" data-add-to="${column.id}">+ เพิ่มงาน</button>
            </section>`;
        }).join("");
        bindBoardEvents();
      }

      function cardTemplate(card) {
        const columnIndex = indexOfColumn(card.columnId);
        const canMoveLeft = columnIndex > 0;
        const canMoveRight = columnIndex < columns.length - 1;
        return `
          <article class="card" draggable="true" data-card-id="${card.id}">
            <p class="card-text">${escapeHtml(card.text)}</p>
            <div class="card-actions">
              <div class="mobile-moves" aria-label="ย้ายงาน">
                <button class="move-button" type="button" data-move="left" aria-label="ย้ายไปขั้นตอนก่อนหน้า" ${canMoveLeft ? "" : "disabled"}>←</button>
                <button class="move-button" type="button" data-move="right" aria-label="ย้ายไปขั้นตอนถัดไป" ${canMoveRight ? "" : "disabled"}>→</button>
              </div>
              <div class="edit-delete">
                <button class="icon-button" type="button" data-edit>แก้ไข</button>
                <button class="icon-button delete" type="button" data-delete>ลบ</button>
              </div>
            </div>
          </article>`;
      }

      function bindBoardEvents() {
        board.querySelectorAll("[data-add-to]").forEach(button => button.addEventListener("click", () => addCard(button.dataset.addTo)));
        board.querySelectorAll("[data-edit]").forEach(button => button.addEventListener("click", () => editCard(button.closest(".card").dataset.cardId)));
        board.querySelectorAll("[data-delete]").forEach(button => button.addEventListener("click", () => deleteCard(button.closest(".card").dataset.cardId)));
        board.querySelectorAll("[data-move]").forEach(button => button.addEventListener("click", () => moveCard(button.closest(".card").dataset.cardId, button.dataset.move)));
        board.querySelectorAll(".card").forEach(card => {
          card.addEventListener("dragstart", (event) => { draggedCardId = card.dataset.cardId; card.classList.add("dragging"); event.dataTransfer.effectAllowed = "move"; });
          card.addEventListener("dragend", () => { draggedCardId = null; card.classList.remove("dragging"); board.querySelectorAll(".column").forEach(column => column.classList.remove("is-over")); });
        });
        board.querySelectorAll(".column").forEach(column => {
          column.addEventListener("dragover", event => { event.preventDefault(); event.dataTransfer.dropEffect = "move"; column.classList.add("is-over"); });
          column.addEventListener("dragleave", () => column.classList.remove("is-over"));
          column.addEventListener("drop", event => { event.preventDefault(); column.classList.remove("is-over"); if (draggedCardId) moveToColumn(draggedCardId, column.dataset.columnId); });
        });
      }

      function addCard(columnId) {
        const text = prompt("พิมพ์ชื่องานสัญญาที่ต้องการเพิ่ม:");
        if (!text || !text.trim()) return;
        cards.push({ id: `${Date.now()}-${Math.random().toString(16).slice(2)}`, text: text.trim(), columnId });
        saveCards(); render();
      }
      function editCard(id) {
        const card = cards.find(item => item.id === id);
        if (!card) return;
        const text = prompt("แก้ไขชื่องาน:", card.text);
        if (!text || !text.trim()) return;
        card.text = text.trim(); saveCards(); render();
      }
      function deleteCard(id) {
        const card = cards.find(item => item.id === id);
        if (!card || !confirm(`ต้องการลบงาน “${card.text}” ใช่หรือไม่?\nการลบนี้กู้คืนไม่ได้`)) return;
        cards = cards.filter(item => item.id !== id); saveCards(); render();
      }
      function moveCard(id, direction) {
        const card = cards.find(item => item.id === id);
        if (!card) return;
        const nextColumn = columns[indexOfColumn(card.columnId) + (direction === "left" ? -1 : 1)];
        if (nextColumn) moveToColumn(id, nextColumn.id);
      }
      function moveToColumn(id, columnId) {
        const card = cards.find(item => item.id === id);
        if (!card || card.columnId === columnId) return;
        card.columnId = columnId; saveCards(); render();
      }

      function setTheme(theme) {
        document.documentElement.dataset.theme = theme;
        localStorage.setItem(THEME_KEY, theme);
        themeButton.textContent = theme === "dark" ? "☀ โหมดสว่าง" : "◐ โหมดมืด";
      }
      const savedTheme = localStorage.getItem(THEME_KEY);
      setTheme(savedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
      themeButton.addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
      render();
    })();
  </script>
</body>
</html>
